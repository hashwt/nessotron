<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pixel Agents Office</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; padding: 0; background: #1e1e2e; font-family: system-ui, sans-serif; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }

  #picker {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: 800px; margin: 10px auto; padding: 0 16px; box-sizing: border-box;
  }
  #picker:empty { display: none; }
  .pick {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 6px 8px 6px; border: 2px solid #3a3a50; border-radius: 8px;
    background: #2b2b3d; color: #c9c9dc; font: inherit; font-size: 12px; cursor: pointer;
  }
  .pick:hover { border-color: #6e6488; }
  .pick.active { border-color: #e2c35a; background: #35354a; color: #fff; }
  /* idle sheet is 4 frames of 16x32; show frame 3 (facing down) at 3x */
  .portrait {
    width: 48px; height: 66px;
    background-repeat: no-repeat; background-size: 192px 96px; background-position: -144px -27px;
    image-rendering: pixelated;
  }
  .hint { text-align: center; color: #7d7d96; font-size: 12px; margin: 0 0 12px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="picker"></div>
<p class="hint">Arrows/WASD move · click to walk · E/Space sit · 1–9 or click a portrait to switch character</p>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="src/CharacterAnims.js"></script>
<script src="src/Character.js"></script>
<script src="src/Pathfinder.js"></script>
<script src="src/Traffic.js"></script>
<script src="src/GameScene.js"></script>
<script src="src/CharacterPicker.js"></script>
<script src="src/main.js"></script>
</body>
</html>
